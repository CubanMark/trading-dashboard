name: Monthly Sector Refresh

on:
  schedule:
    - cron: '0 3 1 * *'  # 1st of each month, 03:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: read

jobs:
  sector-refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: db/
          key: dashboard-db-sector-${{ github.run_number }}
          restore-keys: |
            dashboard-db-

      - name: Refresh sector/industry classifications
        run: python scripts/refresh_sectors.py
